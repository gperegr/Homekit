<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Hub – tvOS + Casa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#dbe8ff;--b1:#ff9ec0;--b2:#7fb4ff;--b3:#ffd88a;--tx:#1d1d1f;--mut:rgba(60,60,67,.62);
  --gt:rgba(255,255,255,.34);--gt2:rgba(255,255,255,.55);--gb:rgba(255,255,255,.75);--sh:rgba(50,70,130,.2);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08080f;--b1:#5b34c9;--b2:#0a5fe0;--b3:#c2305f;--tx:#fff;--mut:rgba(235,235,245,.62);
  --gt:rgba(255,255,255,.09);--gt2:rgba(255,255,255,.2);--gb:rgba(255,255,255,.26);--sh:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#08080f;--b1:#5b34c9;--b2:#0a5fe0;--b3:#c2305f;--tx:#fff;--mut:rgba(235,235,245,.62);
  --gt:rgba(255,255,255,.09);--gt2:rgba(255,255,255,.2);--gb:rgba(255,255,255,.26);--sh:rgba(0,0,0,.5);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',Inter,'Segoe UI',sans-serif;color:var(--tx);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;outline:0}
#wrap{position:relative;width:100%;height:100%}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:800px;transform:translate(-50%,-50%) scale(var(--s,1));background:var(--bg);overflow:hidden}
.bl{position:absolute;width:640px;height:640px;border-radius:50%;filter:blur(70px);opacity:.7;animation:dr 26s ease-in-out infinite alternate}
.bl:nth-child(1){background:var(--b1);left:-120px;top:-140px}
.bl:nth-child(2){background:var(--b2);right:-100px;top:120px;animation-delay:-9s}
.bl:nth-child(3){background:var(--b3);left:360px;bottom:-300px;animation-delay:-15s}
@keyframes dr{to{transform:translate(110px,70px) scale(1.15)}}
.glass{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--gt2),var(--gt) 45%,var(--gt));
  backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);
  border:1px solid var(--gb);border-color:var(--gb) transparent transparent var(--gb);
  box-shadow:inset 1.5px 1.5px 1px rgba(255,255,255,.55),inset -1px -1px 1px rgba(255,255,255,.12),0 10px 30px var(--sh)}
.glass::after,.sc::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;
  background:radial-gradient(200px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.4),transparent 62%)}
.glass:hover::after,.sc:hover::after,.tilt:focus-visible::after{opacity:1}
.ui{position:absolute;inset:0;z-index:1}
#top{position:absolute;left:44px;right:44px;top:26px;height:70px;display:flex;align-items:center;gap:12px}
.time{font-size:60px;font-weight:300;letter-spacing:-2px;line-height:1}
.date{font-size:18px;font-weight:500;color:var(--mut);margin-top:4px}
.sp{flex:1}
.pill{height:44px;padding:0 18px;border-radius:22px;display:flex;align-items:center;font-size:15px;font-weight:500;gap:8px}
.pill i{width:8px;height:8px;border-radius:50%;background:#30d158;box-shadow:0 0 10px #30d158}
.demo{font-size:12px;font-weight:600;opacity:.7;border-left:1px solid var(--gb);padding-left:10px;margin-left:2px}
.cb{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.cb:active{transform:scale(.88)}
.av{font-size:18px;font-weight:600;background:linear-gradient(135deg,#ff9f0a,#ff375f);color:#fff;border:0}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#main{position:absolute;left:44px;right:44px;top:112px;bottom:106px;display:flex;gap:24px}
#col{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.lb{font-size:13px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);margin:0 0 -2px 6px}
.tilt{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1));transition:transform .3s cubic-bezier(.2,.9,.3,1.25),background .4s,box-shadow .4s;cursor:pointer}
.tilt:hover,.tilt:focus-visible{--sc:1.06;z-index:3;box-shadow:inset 1.5px 1.5px 1px rgba(255,255,255,.6),0 22px 40px var(--sh)}
.tilt:active{--sc:.95}
#scn{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.sc{position:relative;overflow:hidden;height:92px;border:0;border-radius:26px;padding:14px 16px;text-align:left;color:#fff;display:flex;flex-direction:column;justify-content:flex-end}
.sc svg{position:absolute;right:-6px;top:-6px;width:74px;height:74px;opacity:.28;stroke-width:1.3}
.sc b{font-size:17px;font-weight:600}.sc small{font-size:12px;opacity:.85;font-weight:500}
.sc.ping{animation:ping .7s}
@keyframes ping{40%{box-shadow:0 0 0 7px rgba(255,255,255,.55)}}
#chips{display:flex;gap:10px}
.chip{flex:1;height:52px;border-radius:26px;display:flex;align-items:center;gap:9px;padding:0 14px;text-align:left;border:1px solid transparent}
.chip.act{background:rgba(255,255,255,.92);color:#1d1d1f}
.chip.act small{color:rgba(60,60,67,.65)}
.chip svg{width:22px;height:22px;flex:none}
.chip b{display:block;font-size:13px;font-weight:600;line-height:1.1}.chip small{font-size:11px;font-weight:500;color:var(--mut)}
#grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:112px;gap:12px;align-content:start}
.tile{border-radius:28px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;border:1px solid transparent;border-top-color:var(--gb)}
.tile.in{animation:rise .65s cubic-bezier(.2,1.3,.4,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.92);filter:blur(6px)}}
.tile.on{background:rgba(255,255,255,.92);color:#1d1d1f}.tile.on .st{color:rgba(60,60,67,.65)}
.ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--gt2);transition:background .4s,box-shadow .4s}
.ico svg{width:22px;height:22px}
.tile.on .ico{background:var(--c);color:#fff;box-shadow:0 0 20px var(--c)}
.nm{font-size:15px;font-weight:600;line-height:1.15}.st{font-size:12.5px;font-weight:500;color:var(--mut);margin-top:1px}
.pm{position:absolute;right:10px;top:12px;display:flex;gap:5px}
.pm span{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.08);display:grid;place-items:center;font-size:17px;font-weight:600}
aside{width:320px;display:flex;flex-direction:column;gap:14px}
.card{border-radius:32px;padding:18px 20px}
.wx{height:232px;display:flex;flex-direction:column}
.wx .row{display:flex;justify-content:space-between}
.wx .c{font-size:15px;font-weight:600}.wx .t{font-size:62px;font-weight:200;letter-spacing:-3px;line-height:1.05}
.wx .d{font-size:13.5px;color:var(--mut);font-weight:500}
.fc{display:flex;justify-content:space-between;margin-top:auto;font-size:13px;font-weight:500;text-align:center}
.fc div{display:flex;flex-direction:column;gap:5px;align-items:center;color:var(--mut)}.fc b{color:var(--tx);font-weight:600}.fc svg{width:22px;height:22px}
.sun{animation:sp 30s linear infinite;transform-origin:30px 30px}@keyframes sp{to{transform:rotate(360deg)}}
.cl{animation:dft 6s ease-in-out infinite alternate}@keyframes dft{to{transform:translateX(7px)}}
.cal{flex:1;min-height:0}
.cal h3{margin:0 0 6px;font-size:16px;font-weight:600;text-transform:capitalize;color:#ff453a}
.mg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:13px;font-weight:500}
.mg .h{color:var(--mut);font-size:11px;height:18px}
.mg span{width:24px;height:24px;line-height:24px;margin:auto;border-radius:50%}
.mg .o{opacity:.3}.mg .td{background:#ff453a;color:#fff;font-weight:700;animation:pu 2.6s infinite}
@keyframes pu{50%{box-shadow:0 0 0 5px rgba(255,69,58,.28)}}
.ev{display:flex;gap:9px;align-items:center;margin-top:8px;font-size:13px;font-weight:600}
.ev::before{content:"";width:3px;height:26px;border-radius:2px;background:var(--c)}
.ev small{display:block;font-size:11px;color:var(--mut);font-weight:500}
#dock{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);height:76px;padding:6px;border-radius:38px;display:flex}
#tabs{position:relative;display:flex}
#lens{position:absolute;top:0;left:0;height:100%;border-radius:32px;background:var(--gt2);box-shadow:inset 1.5px 1.5px 1px rgba(255,255,255,.7),inset -1px -1px 1px rgba(255,255,255,.2),0 4px 16px var(--sh);transition:transform .6s cubic-bezier(.3,1.35,.5,1),width .6s cubic-bezier(.3,1.35,.5,1),opacity .3s}
.tab{position:relative;width:112px;height:64px;border:0;background:none;border-radius:32px;color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;cursor:pointer;opacity:.7;transition:opacity .3s,transform .5s cubic-bezier(.3,1.6,.5,1)}
.tab.act{opacity:1;color:#0a84ff}.tab:active{transform:scale(.9)}
#amb{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.35);backdrop-filter:blur(40px) saturate(160%);-webkit-backdrop-filter:blur(40px) saturate(160%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 1.1s;cursor:pointer}
#amb.show{opacity:1;pointer-events:auto}
#amb .big{font-size:190px;font-weight:200;letter-spacing:-8px;line-height:1}
#amb .sub{font-size:26px;font-weight:500;opacity:.8;margin-top:10px}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <i class="bl"></i><i class="bl"></i><i class="bl"></i>
  <div class="ui">
    <div id="top">
      <div><div class="time" id="clk">--:--</div><div class="date" id="dt"></div></div>
      <div class="sp"></div>
      <div class="pill glass" title="Os aparelhos exibidos são exemplos e ainda não estão conectados à sua conta"><i></i><span id="sum"></span><span class="demo">Demonstração</span></div>
      <button class="cb glass" id="amBtn" aria-label="Modo ambiente"><svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
      <button class="cb glass" id="thBtn" aria-label="Tema"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg></button>
      <button class="cb av" aria-label="Perfil">C</button>
    </div>
    <div id="main">
      <div id="col">
        <div class="lb">Cenas</div><div id="scn"></div>
        <div id="chips"></div>
        <section id="grid"></section>
      </div>
      <aside>
        <div class="card glass wx">
          <div class="row"><div><div class="c">São Paulo</div><div class="t">24°</div><div class="d">Parcialmente nublado<br>Máx 27° · Mín 17°</div></div>
            <svg width="86" height="72" viewBox="0 0 86 72"><g class="sun"><circle cx="30" cy="30" r="12" fill="#ffd60a"/><g stroke="#ffd60a" stroke-width="3.5" stroke-linecap="round"><path d="M30 8v5M30 47v5M8 30h5M47 30h5M14 14l3.5 3.5M42.5 42.5L46 46M46 14l-3.5 3.5M17.5 42.5L14 46"/></g></g><g class="cl"><path d="M34 62a11 11 0 0 1 2-21 14 14 0 0 1 27 4 9 9 0 0 1 0 17z" fill="#fff" opacity=".95"/></g></svg></div>
          <div class="fc" id="fc"></div>
        </div>
        <div class="card glass cal"><h3 id="mh"></h3><div class="mg" id="mg"></div><div id="evs"></div></div>
      </aside>
    </div>
    <div id="dock" class="glass"><div id="tabs"><div id="lens"></div></div></div>
  </div>
  <div id="amb"><div class="big" id="ac"></div><div class="sub" id="ad"></div><div class="sub" style="font-size:20px;opacity:.6">24° · Parcialmente nublado</div></div>
</div></div>
<script>
const P={
 bulb:'M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z',
 lamp:'M8 3h8l2 7H6zM12 10v10M8 21h8',
 tv:'M5 5h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM8 21h8',
 snow:'M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9',
 blinds:'M4 4h16M6 8h12M6 12h12M6 16h12M12 16v4',
 spk:'M7 3h10a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM12 17a3 3 0 1 0 0 .01M12 7.5v.01',
 cof:'M5 9h11v6a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4zM16 10h2a2 2 0 0 1 0 4h-2M8 3v2M12 3v2',
 fan:'M12 12m-1.5 0a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0M12 10.5C12 6 14 3 16 4s0 5-2.5 6.5M13.5 12.5C18 13 21 15 20 17s-5 0-6.5-2.5M10.5 13.5C9 18 6 20 4.5 19s0-5 2.5-6.5',
 plug:'M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4',
 mon:'M4 4h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM9 20h6M12 16v4',
 prn:'M7 8V3h10v5M7 17H5a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2M7 14h10v7H7z',
 drop:'M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z',
 lock:'M6 11h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1zM8 11V8a4 4 0 0 1 8 0v3',
 cam:'M3 7h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H3zM16 11l5-3v8l-5-3',
 star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',
 sofa:'M5 11V8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3M3 13a2 2 0 0 1 4 0v2h10v-2a2 2 0 0 1 4 0v5H3zM6 18v2M18 18v2',
 kit:'M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-3 5-3 8h3v10',
 bed:'M3 18V6M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5M7 11.5a1.5 1.5 0 1 0 0 .01',
 bag:'M4 8h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1zM9 8V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3M3 13h18',
 leaf:'M5 19C5 10 10 5 20 4c0 10-5 15-14 15zM5 19l8-8',
 cld:'M7 18a4.5 4.5 0 0 1 .5-9 6 6 0 0 1 11 2 3.5 3.5 0 0 1-.5 7z',
 sun:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M2 12h2M20 12h2',
 rain:'M7 15a4.5 4.5 0 0 1 .5-9 6 6 0 0 1 11 2 3.5 3.5 0 0 1-.5 7zM9 19l-1 2M13 19l-1 2M17 19l-1 2',
 moon:'M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z',
 home:'M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10'
};
const S=k=>`<svg class="i" viewBox="0 0 24 24"><path d="${P[k]}"/></svg>`;
const Y='#ff9f0a',B='#0a84ff',G='#30d158';
const D={
 'Sala':[['bulb','Luz do teto',Y,1,'80%',1],['lamp','Luminária',Y,0,'',0],['tv','TV',B,1,'Apple TV',1],['snow','Ar-condicionado',B,1,'23°',1,1],['blinds','Cortina',G,1,'Aberta 60%',0],['spk','Caixa de som',B,0,'',0]],
 'Cozinha':[['bulb','Luz principal',Y,1,'100%',1],['bulb','Bancada',Y,0,'',0],['cof','Cafeteira',G,0,'',1],['fan','Exaustor',B,0,'',0],['plug','Tomada bancada',G,1,'Ligada',0]],
 'Quarto':[['bulb','Luz do teto',Y,0,'',0],['lamp','Abajur',Y,1,'35%',1],['snow','Ar-condicionado',B,0,'',0,1],['blinds','Blackout',G,0,'',0],['fan','Ventilador',B,0,'',0]],
 'Escritório':[['bulb','Luz',Y,1,'90%',0],['mon','Tomada do PC',G,1,'Ligada',0],['snow','Ar-condicionado',B,0,'',0,1],['prn','Impressora',G,0,'',0]],
 'Varanda':[['bulb','Luz externa',Y,0,'',0],['drop','Irrigação',B,0,'Agendada 18h',0],['lock','Porta da frente',G,1,'Trancada',1],['cam','Câmera',B,1,'Ao vivo',0]]
};
const R={'Favoritos':'star','Sala':'sofa','Cozinha':'kit','Quarto':'bed','Escritório':'bag','Varanda':'leaf'};
const CAT={bulb:'luz',lamp:'luz',snow:'clima',fan:'clima',lock:'seg',cam:'seg',tv:'tv',spk:'tv',drop:'agua'};
const CH=[['luz','bulb','Luzes'],['clima','snow','Clima'],['seg','lock','Segurança'],['tv','tv','TV e som'],['agua','drop','Água']];
const set=(d,o,s)=>{d[3]=o;if(s)d[4]=s};
const SC=[['Bom dia','sun','linear-gradient(135deg,#ff9a3c,#ff4f7b)','Acordar',()=>{set(D.Cozinha[0],1,'100%');set(D.Cozinha[2],1,'Ligada');set(D.Sala[4],1,'Aberta 100%');set(D.Quarto[1],0)}],
 ['Chegar em casa','home','linear-gradient(135deg,#34c7a0,#0a84ff)','Boas-vindas',()=>{set(D.Sala[0],1,'80%');set(D.Sala[3],1,'23°');set(D.Varanda[2],0)}],
 ['Cinema','tv','linear-gradient(135deg,#7d4cdb,#3a2d8f)','Sala',()=>{set(D.Sala[0],0);set(D.Sala[1],1,'20%');set(D.Sala[2],1,'Apple TV');set(D.Sala[4],0)}],
 ['Boa noite','moon','linear-gradient(135deg,#2c3e8f,#0b1033)','Dormir',()=>{all().forEach(d=>{if(CAT[d[0]]==='luz')d[3]=0});set(D.Varanda[2],1,'Trancada');set(D.Sala[2],0);set(D.Sala[3],0)}]];
let cur='Favoritos',sel=null;const $=s=>document.querySelector(s);
const all=()=>Object.values(D).flat();
const list=()=>sel?all().filter(d=>CAT[d[0]]===sel):cur==='Favoritos'?all().filter(d=>d[5]):D[cur];
const stx=d=>d[3]?(d[4]||'Ligado'):d[0]==='lock'?'Destrancada':d[0]==='blinds'?'Fechada':'Desligado';
function tabs(){$('#tabs').insertAdjacentHTML('beforeend',Object.keys(R).map(r=>`<button class="tab" data-r="${r}">${S(R[r])}${r}</button>`).join(''))}
function mark(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('act',!sel&&b.dataset.r===cur));const b=$('.tab[data-r="'+cur+'"]'),l=$('#lens');l.style.opacity=sel?0:1;l.style.width=b.offsetWidth+'px';l.style.transform=`translateX(${b.offsetLeft}px)`}
function chips(){const A=all();$('#chips').innerHTML=CH.map(([k,ic,n])=>{const L=A.filter(d=>CAT[d[0]]===k);let s;
 if(k==='luz'){const c=L.filter(d=>d[3]).length;s=c?c+(c>1?' ligadas':' ligada'):'Apagadas'}
 else if(k==='clima'){const a=L.find(d=>d[6]&&d[3]);s=a?a[4]:L.some(d=>d[3])?'Ventilando':'Desligado'}
 else if(k==='seg'){s=L.find(d=>d[0]==='lock')[3]?'Trancada':'Destrancada'}
 else if(k==='tv'){const c=L.filter(d=>d[3]).length;s=c?c+' em uso':'Em espera'}
 else s='Agendada 18h';
 return `<button class="chip glass tilt ${sel===k?'act':''}" data-k="${k}">${S(ic)}<div><b>${n}</b><small>${s}</small></div></button>`}).join('')}
function grid(anim){$('#grid').innerHTML=list().map((d,i)=>{const[ic,n,c,on,,,t]=d;
 return `<button class="tile glass tilt ${on?'on':''} ${anim?'in':''}" data-i="${i}" style="--c:${c};animation-delay:${i*55}ms"><span class="ico">${S(ic)}</span>${t&&on?'<div class="pm"><span data-d="-1">−</span><span data-d="1">+</span></div>':''}<div><div class="nm">${n}</div><div class="st">${stx(d)}</div></div></button>`}).join('');
 $('#sum').textContent=all().filter(d=>d[3]).length+' dispositivos ligados'}
const ref=a=>{grid(a);chips()};
$('#scn').innerHTML=SC.map((s,i)=>`<button class="sc tilt" data-s="${i}" style="background:${s[2]}">${S(s[1])}<b>${s[0]}</b><small>${s[3]}</small></button>`).join('');
$('#scn').onclick=e=>{const b=e.target.closest('.sc');if(!b)return;SC[b.dataset.s][4]();b.classList.remove('ping');void b.offsetWidth;b.classList.add('ping');ref(0)};
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;sel=sel===b.dataset.k?null:b.dataset.k;mark();ref(1)};
$('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;if(b.dataset.r===cur&&!sel)return;cur=b.dataset.r;sel=null;mark();ref(1)};
$('#grid').onclick=e=>{const t=e.target.closest('.tile');if(!t)return;const d=list()[t.dataset.i],p=e.target.closest('.pm span');
 if(p){d[4]=(parseInt(d[4]||23)+ +p.dataset.d)+'°'}else{d[3]=d[3]?0:1;if(d[6]&&d[3]&&!d[4])d[4]='23°'}ref(0)};
const wd=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'],mn=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function tick(){const n=new Date(),t=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
 $('#clk').textContent=$('#ac').textContent=t;$('#dt').textContent=$('#ad').textContent=`${wd[n.getDay()]}, ${n.getDate()} de ${mn[n.getMonth()]}`}
function cal(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),f=new Date(y,m,1).getDay(),dm=new Date(y,m+1,0).getDate(),pd=new Date(y,m,0).getDate();
 $('#mh').textContent=mn[m]+' '+y;let h='DSTQQSS'.split('').map(c=>`<span class="h">${c}</span>`).join('');
 for(let i=0;i<35;i++){const d=i-f+1;h+=d<1?`<span class="o">${pd+d}</span>`:d>dm?`<span class="o">${d-dm}</span>`:`<span class="${d===n.getDate()?'td':''}">${d}</span>`}
 $('#mg').innerHTML=h;
 $('#evs').innerHTML=[['#0a84ff','Reunião de equipe','09:30 – 10:30'],['#30d158','Almoço com Ana','12:30 – 14:00']].map(e=>`<div class="ev" style="--c:${e[0]}"><div>${e[1]}<small>${e[2]}</small></div></div>`).join('');
 $('#fc').innerHTML=[['15h','sun','25°'],['16h','cld','24°'],['17h','rain','22°'],['18h','rain','20°'],['19h','cld','19°']].map(f=>`<div>${f[0]}${S(f[1])}<b>${f[2]}</b></div>`).join('')}
let sc=1,last;function fit(){const w=$('#wrap');sc=Math.min(w.clientWidth/1280,w.clientHeight/800);document.documentElement.style.setProperty('--s',sc);mark()}
addEventListener('resize',fit);
document.addEventListener('pointermove',e=>{const g=e.target.closest('.glass,.sc');if(g){const r=g.getBoundingClientRect();g.style.setProperty('--mx',(e.clientX-r.left)/sc+'px');g.style.setProperty('--my',(e.clientY-r.top)/sc+'px')}
 const t=e.target.closest('.tilt');if(last&&last!==t){last.style.removeProperty('--rx');last.style.removeProperty('--ry')}last=t;
 if(t){const r=t.getBoundingClientRect();t.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*9+'deg');t.style.setProperty('--rx',-((e.clientY-r.top)/r.height-.5)*9+'deg')}});
const dark=()=>document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
$('#thBtn').onclick=()=>{document.documentElement.dataset.theme=dark()?'light':'dark'};
const amb=$('#amb');let idle;
const wake=()=>{amb.classList.remove('show');clearTimeout(idle);idle=setTimeout(()=>amb.classList.add('show'),60000)};
$('#amBtn').onclick=e=>{e.stopPropagation();amb.classList.add('show')};
amb.onclick=e=>{e.stopPropagation();wake()};
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{if(!amb.classList.contains('show'))wake()}));
tabs();cal();tick();ref(1);fit();wake();setInterval(tick,1000);
document.fonts&&document.fonts.ready.then(mark);
</script>
